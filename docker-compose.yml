name: samaj

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile

    image: samaj-backend
    container_name: samaj-backend

    restart: unless-stopped

    env_file:
      - .env

    ports:
      - "8003:8000"

    environment:
      - NODE_ENV=development
      - PORT=8000

    extra_hosts:
      - "host.docker.internal:host-gateway"

    networks:
      - default
      - shared_network

networks:
  shared_network:
    external: true
    name: shikshadisha_default # Name of the docker network where sd_postgres, redis, rabbitmq reside

