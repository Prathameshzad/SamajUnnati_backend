name: samaj

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile

    image: samaj-backend
    container_name: samaj-backend

    restart: unless-stopped

    env_file:
      - .env

    ports:
      - "8003:8000"

    environment:
      NODE_ENV: development
      PORT: 8000

    extra_hosts:
      - "host.docker.internal:host-gateway"

    networks:
      - default
      - shikshadisha

networks:
  shikshadisha:
    external: true
    name: shikshadisha-network